[project]
name = "dentcare-backend"
version = "0.1.0"
description = "DentCare FastAPI backend (Vercel Python runtime) backed by Supabase Postgres."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic>=2.10,<2.11",
  "pydantic-settings>=2.7,<2.8",
  "supabase>=2.4,<2.5",
  "psycopg[binary,pool]>=3.2,<3.3",
  "python-jose[cryptography]>=3.3,<3.4",
  "passlib[bcrypt]>=1.7,<1.8",
  "httpx>=0.24,<0.28",
  "python-dotenv>=1.0,<1.1",
  "structlog>=24.4,<24.5",
  "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<8.4",
  "pytest-asyncio>=0.26,<0.27",
  "httpx>=0.24,<0.28",
  "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/repositories/appointment_repo.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
